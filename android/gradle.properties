org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# build-android runs in an owned one-shot process tree; don't leave a daemon behind.
org.gradle.daemon=false
# Keep Kotlin compiler processes inside the Gradle process tree as well.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
android.useAndroidX=true
# TODO(2026-10): android.newDsl=false and android.builtInKotlin=false are temporary
# AGP 9 opt-outs from the Flutter template. Re-check them on every Flutter/AGP
# bump and remove them once the template drops them.
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

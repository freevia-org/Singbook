<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Singbook Microsoft Store poster candidate</title>
  <style>
    @font-face {
      font-family: "Singbook Serif";
      src: url("../../../assets/fonts/SingbookSerif-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    :root {
      color-scheme: dark;
      --navy: #081b33;
      --navy-2: #0b2745;
      --parchment: #f7f3e9;
      --amber: #efb746;
      --blue: #6ea3ce;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1440px; height: 2160px; overflow: hidden; }
    body { font-family: Arial, Helvetica, sans-serif; background: var(--navy); }
    .poster {
      position: relative;
      width: 1440px;
      height: 2160px;
      overflow: hidden;
      color: var(--parchment);
      background:
        radial-gradient(ellipse 900px 750px at 50% 47%, rgba(55, 111, 157, .26), transparent 72%),
        linear-gradient(155deg, #0b223e 0%, #081b33 55%, #0e2b48 100%);
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .33;
      background: repeating-linear-gradient(0deg, transparent 0 94px, rgba(126, 169, 204, .09) 95px 96px, transparent 97px 190px);
      mask-image: linear-gradient(transparent 10%, black 31%, black 66%, transparent 86%);
    }
    .corner { position: absolute; width: 190px; height: 190px; border: 3px solid rgba(239, 183, 70, .55); }
    .corner.tl { left: 72px; top: 70px; border-right: 0; border-bottom: 0; }
    .corner.br { right: 72px; bottom: 70px; border-left: 0; border-top: 0; }
    .brand { position: absolute; top: 143px; left: 104px; right: 104px; text-align: center; }
    .brand h1 { margin: 0; font: 700 174px/1 "Singbook Serif", Georgia, serif; letter-spacing: -5px; }
    .brand p { margin: 25px 0 0; color: var(--blue); font-size: 29px; font-weight: 700; letter-spacing: 9px; text-transform: uppercase; }
    .icon-halo {
      position: absolute; top: 482px; left: 200px; width: 1040px; height: 1040px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79, 133, 174, .36), rgba(79, 133, 174, .07) 58%, transparent 73%);
      filter: blur(16px);
    }
    .icon {
      position: absolute; top: 526px; left: 245px; width: 950px; height: 950px;
      object-fit: contain;
      filter: drop-shadow(0 40px 52px rgba(1, 8, 18, .32));
    }
    .copy { position: absolute; left: 106px; right: 106px; top: 1570px; text-align: center; }
    .copy .rule { width: 94px; height: 8px; background: var(--amber); border-radius: 8px; margin: 0 auto 49px; }
    .copy h2 { margin: 0; font: 700 104px/1.09 "Singbook Serif", Georgia, serif; letter-spacing: -3px; }
    .copy h2 span { color: var(--amber); }
    .copy p { margin: 48px 0 0; font-size: 37px; line-height: 1.3; color: #cfdfeb; }
    .footer { position: absolute; left: 106px; right: 106px; bottom: 126px; display: flex; justify-content: space-between; align-items: center; color: #a8c2d7; font-size: 26px; letter-spacing: 1px; }
    .footer strong { color: var(--parchment); font-weight: 700; }
    .footer .dot { width: 13px; height: 13px; border-radius: 50%; background: var(--amber); display: inline-block; margin: 0 12px 2px; }
  </style>
</head>
<body>
  <main class="poster" aria-label="Singbook poster art, not an app screenshot">
    <div class="corner tl"></div><div class="corner br"></div>
    <header class="brand"><h1>Singbook</h1><p>Your songs, ready</p></header>
    <div class="icon-halo"></div>
    <img class="icon" alt="Singbook open songbook icon" src="../../../assets/branding/singbook-icon.png">
    <section class="copy"><div class="rule"></div><h2>Lyrics. Chords.<br><span>Setlists.</span></h2><p>A songbook for rehearsal and stage.</p></section>
    <footer class="footer"><strong>freevia</strong><span>Open-source<span class="dot"></span>Offline ready</span></footer>
  </main>
</body>
</html>

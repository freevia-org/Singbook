name: UX batch validation

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ux-batch-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get locked dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Run the six focused regression files
        timeout-minutes: 10
        run: |
          mkdir -p artifacts/ux-batch-validation
          flutter test --no-pub --concurrency=1 --reporter expanded --timeout 90s \
            --dart-define=SINGBOOK_SOURCE_CATALOG_URL=about:blank \
            test/ui/creation_draft_persistence_test.dart \
            test/ui/adapter_behavior_test.dart \
            test/ui/editor_save_transition_test.dart \
            test/ui/player_compact_layout_test.dart \
            test/ui/combined_reader_settings_test.dart \
            test/ui/screens_test.dart \
            2>&1 | tee artifacts/ux-batch-validation/focused-tests.log
      - name: Preserve focused regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-focused-regressions-${{ github.sha }}
          path: artifacts/ux-batch-validation/
          if-no-files-found: ignore
          retention-days: 7

  host-visuals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Get locked dependencies
        run: flutter pub get --enforce-lockfile --no-example
      - name: Capture the 25 host screenshots
        timeout-minutes: 6
        run: |
          mkdir -p artifacts/ux-batch-validation
          flutter test --no-pub --concurrency=1 --reporter expanded --timeout 60s \
            --dart-define=SINGBOOK_SOURCE_CATALOG_URL=about:blank \
            --dart-define=UI_BATCH_CAPTURE_DIR=artifacts/ux-batch-validation/captures \
            test/ui/ui_batch_visual_capture.dart \
            2>&1 | tee artifacts/ux-batch-validation/host-visuals.log
      - name: Verify and hash the fresh capture set
        env:
          VALIDATED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          root = Path('artifacts/ux-batch-validation')
          captures = root / 'captures'
          scenarios = ('phone', 'compact_large', 'landscape', 'wide_rtl', 'tablet')
          screens = ('library', 'setlists', 'reader', 'speed-held', 'fullscreen')
          expected = {f'{scenario}-{screen}' for scenario in scenarios for screen in screens}
          assert {p.stem for p in captures.glob('*.png')} == expected, 'Missing or extra PNG captures'
          assert {p.stem for p in captures.glob('*.json')} == expected, 'Missing or extra capture sidecars'
          files = {}
          for name in sorted(expected):
              sidecar = json.loads((captures / f'{name}.json').read_text())
              assert sidecar['screen'] == name
              assert sidecar['evidenceKind'] == 'host_widget_screenshot'
              assert sidecar['nativeFullscreenVerified'] is False
              platform = 'windows' if name.startswith('wide_rtl-') else 'android'
              assert sidecar['targetPlatform'] == platform
              for extension in ('png', 'json'):
                  path = captures / f'{name}.{extension}'
                  files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          manifest = {'sourceSha': os.environ['VALIDATED_SOURCE_SHA'],
                      'evidenceKind': 'host_widget_screenshots', 'pngCount': 25,
                      'nativeFullscreenVerified': False, 'files': files}
          (root / 'capture-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Preserve fresh host screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-host-visuals-${{ github.sha }}
          path: artifacts/ux-batch-validation/
          if-no-files-found: ignore
          retention-days: 7

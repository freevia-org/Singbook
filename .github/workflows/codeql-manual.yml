name: Manual CodeQL security scan

on:
  workflow_dispatch:
    inputs:
      runner_pool:
        description: Runner pool for this manual CodeQL scan
        type: choice
        required: true
        default: local
        options:
          - local
          - hosted

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

env:
  # Keep aligned with ci.yml and build-macos.yml.
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Persistent local runners only analyze main; hosted runners are an explicit
    # manual fallback for validating the ref selected in workflow_dispatch.
    if: inputs.runner_pool == 'hosted' || github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner_pool == 'hosted' && matrix.hosted_runner || matrix.local_runner }}
    timeout-minutes: ${{ matrix.language == 'java-kotlin' && 180 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - language: actions
            local_runner: singbook-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: c-cpp
            local_runner: singbook-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: java-kotlin
            local_runner: singbook-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: manual
          - language: python
            local_runner: singbook-i5-linux
            hosted_runner: ubuntu-24.04
            build-mode: none
          - language: swift
            local_runner: singbook-macmini
            hosted_runner: macos-15
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          persist-credentials: false
      - name: Set up Java for Java/Kotlin extraction
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Java runtime
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}"
          java -version
      - name: Verify Android SDK and accepted licenses
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo 'ANDROID_SDK_ROOT and ANDROID_HOME are unset on this runner.' >&2
            exit 1
          fi
          sdk_root="$(realpath "$sdk_root")"
          echo "Android SDK root: $sdk_root"
          sdkmanager="$(find -L "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -executable -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "No executable sdkmanager was found under $sdk_root/cmdline-tools." >&2
            exit 1
          fi
          test -d "$sdk_root/platforms/android-36" || {
            echo 'Required Android platform android-36 is not installed.' >&2
            exit 1
          }
          test -d "$sdk_root/build-tools/36.0.0" || {
            echo 'Required Android build-tools 36.0.0 are not installed.' >&2
            exit 1
          }
          test -s "$sdk_root/licenses/android-sdk-license" || {
            echo 'Accepted Android SDK license record is missing: licenses/android-sdk-license.' >&2
            exit 1
          }
          "$sdkmanager" --list_installed | grep -E 'platforms;android-36|build-tools;36\.0\.0'
      - name: Install pinned Flutter SDK
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          setup_script="$(mktemp "$RUNNER_TEMP/singbook-flutter-setup.XXXXXX")"
          trap 'rm -f "$setup_script"' EXIT
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/subosito/flutter-action/1a449444c387b1966244ae4d4f8c696479add0b2/setup.sh' \
            --output "$setup_script"
          echo '35f0cd9e9c1d7a643448223573b4a03879e63676fdc27872de3d0104d5bf89f9  '"$setup_script" | shasum --check --status
          bash "$setup_script" -n "$FLUTTER_VERSION" -a "$RUNNER_ARCH" stable
      - name: Verify Flutter and resolve dependencies
        if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get --enforce-lockfile --no-example
      - name: Verify Flutter Android project preparation
        if: matrix.language == 'java-kotlin'
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME:-}"
          java -version
          flutter build apk --debug --config-only --no-pub
          test -f .dart_tool/package_config.json
          test -f android/local.properties
          test -f android/app/build.gradle.kts
      - name: Prepare Flutter macOS workspace for Swift analysis
        if: matrix.language == 'swift'
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F': *' '/^version:/ {print $2}' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          flutter build macos --release --build-number="${version##*+}" --config-only --no-pub
          test -f macos/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          test -f macos/Runner.xcworkspace/contents.xcworkspacedata
          test -f macos/Runner.xcodeproj/project.xcworkspace/contents.xcworkspacedata
          xcodebuild -resolvePackageDependencies -workspace macos/Runner.xcworkspace -scheme Runner
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        timeout-minutes: 20
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Android debug app under CodeQL tracing
        if: matrix.language == 'java-kotlin'
        timeout-minutes: 45
        run: flutter build apk --debug --no-pub
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        timeout-minutes: 120
        with:
          category: /language:${{ matrix.language }}

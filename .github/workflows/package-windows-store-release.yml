name: Package and smoke test Microsoft Store release

# Replaces the per-release package-windows-store29/30/32/33 workflows, which were
# identical apart from their pins. Each release consumes the exact hosted CI
# bundle pinned below. It never uploads to Partner Center; the unsigned MSIX and
# evidence are retained for a separate owner-verified submission.
#
# Adding a release: add a `release` choice and a matching block in the
# "Resolve release pins" step. Releases whose CI artifact pins were supplied at
# dispatch time (29, 30) still require all five artifact inputs; releases with
# frozen pins (32, 33, 34, 35, 36) reject overrides.
#
# Pull requests that change this workflow or the Store scripts package and
# smoke test the default (newest frozen) release as a self-test.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Store release build number to package
        required: true
        default: '36'
        type: choice
        options: ['29', '30', '32', '33', '34', '35', '36']
      ci_run_id:
        description: Successful CI run ID for the pinned release commit (releases 29 and 30 only)
        required: false
        type: string
      ci_artifact_id:
        description: windows-release-bundle artifact ID from that CI run (releases 29 and 30 only)
        required: false
        type: string
      ci_artifact_digest:
        description: Exact GitHub artifact digest, sha256:<64 hex characters> (releases 29 and 30 only)
        required: false
        type: string
      portable_manifest_sha256:
        description: SHA-256 of the portable manifest.json (releases 29 and 30 only)
        required: false
        type: string
      portable_zip_sha256:
        description: SHA-256 of the portable release ZIP (releases 29 and 30 only)
        required: false
        type: string
permissions:
  actions: read
  contents: read

concurrency:
  group: store-release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package-and-smoke:
    name: package-and-smoke (release ${{ inputs.release || '36' }})
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE: ${{ inputs.release || '36' }}
      INPUT_CI_RUN_ID: ${{ inputs.ci_run_id }}
      INPUT_CI_ARTIFACT_ID: ${{ inputs.ci_artifact_id }}
      INPUT_CI_ARTIFACT_DIGEST: ${{ inputs.ci_artifact_digest }}
      INPUT_PORTABLE_MANIFEST_SHA256: ${{ inputs.portable_manifest_sha256 }}
      INPUT_PORTABLE_ZIP_SHA256: ${{ inputs.portable_zip_sha256 }}
    steps:
      - name: Resolve release pins
        shell: pwsh
        run: |
          $supplied = [ordered]@{
            CI_RUN_ID = $env:INPUT_CI_RUN_ID
            CI_ARTIFACT_ID = $env:INPUT_CI_ARTIFACT_ID
            CI_ARTIFACT_DIGEST = $env:INPUT_CI_ARTIFACT_DIGEST
            PORTABLE_MANIFEST_SHA256 = $env:INPUT_PORTABLE_MANIFEST_SHA256
            PORTABLE_ZIP_SHA256 = $env:INPUT_PORTABLE_ZIP_SHA256
          }
          switch ($env:RELEASE) {
            '29' {
              # CI builds pull requests from GitHub's synthetic merge commit. Keep this
              # separate from the release head SHA used to validate the run and checkout.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = '49f5b8cd00b264fddcaff247e4f280b758260581'
                RELEASE_COMPILED_SOURCE_SHA = 'd66c1c8173748251b761e15b84f592fa383a8b94'
                RELEASE_SOURCE_TREE = 'a6c373c3d92a4ce7bdb6031ebc1af9a168c39d1f'
                RELEASE_PRODUCT_VERSION = '0.2.15+29'
                RELEASE_CI_BRANCH = 'codex/release29-integration'
              }
              $artifactPins = $null
            }
            '30' {
              # Successful candidate CI compiled a synthetic merge of main (PR102 merge)
              # and release30-integration. Keep this separate from the PR head checkout.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = '6ba0f68263bc966025b508f74281abaee1902a2f'
                RELEASE_COMPILED_SOURCE_SHA = 'e1bcffebe15d302787fb878b2fc1bfe242169a68'
                RELEASE_SOURCE_TREE = 'af870a5fe897e9eab70e747322a40c084a4554e5'
                RELEASE_PRODUCT_VERSION = '0.2.16+30'
                RELEASE_CI_BRANCH = 'codex/release30-integration'
              }
              $artifactPins = $null
            }
            '32' {
              # Successful candidate CI compiled a synthetic merge of main and release32.
              # Keep this separate from the release branch head checkout.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = 'd26313422fa5ca4677ec0d07fd8d5a71df5bfd40'
                RELEASE_COMPILED_SOURCE_SHA = 'abf53fdfe341ee2a55a496a73961bb2957674ad6'
                RELEASE_SOURCE_TREE = '3fa3d2309fbef01efe9a9ddab344e87fa26a279e'
                RELEASE_PRODUCT_VERSION = '0.2.18+32'
                RELEASE_CI_BRANCH = 'codex/release32'
              }
              $artifactPins = [ordered]@{
                CI_RUN_ID = '39962975385'
                CI_ARTIFACT_ID = '12505164593'
                CI_ARTIFACT_DIGEST = 'sha256:1284dbf4aeceb851cc035c04ff2db82d464383fb313e36f379d8fd5be9734dd2'
                PORTABLE_MANIFEST_SHA256 = '50A546BE5009101D06B750EDF87D0B9C40C191E0169A58EDA8E971F6E12DC31A'
                PORTABLE_ZIP_SHA256 = '1F32D7870EBF9CBC094E6A39C35B58357E778A8FC8107CA11CD6D9D93511FAD6'
              }
            }
            '33' {
              # Successful candidate CI compiled a synthetic merge of main and release33.
              # Keep this separate from the release branch head checkout.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = '9ec6b29504a380531dc38db6f8beed98a9f55195'
                RELEASE_COMPILED_SOURCE_SHA = '870d1e604c9bd1a28e39591ea4140d0cbbd04707'
                RELEASE_SOURCE_TREE = '315bf164f7d657e853804d0c184cb395a2e9f5b5'
                RELEASE_PRODUCT_VERSION = '0.2.19+33'
                RELEASE_CI_BRANCH = 'codex/release33'
              }
              $artifactPins = [ordered]@{
                CI_RUN_ID = '40033776263'
                CI_ARTIFACT_ID = '12536417941'
                CI_ARTIFACT_DIGEST = 'sha256:856f0e33df3cb9e226f9322ea37cdb55fef6a181302f50afa4df5c63ece15a3e'
                PORTABLE_MANIFEST_SHA256 = '167a02f5689c41f2bab9c01597f43a70ef31a934d028e05635103f45eb198ab0'
                PORTABLE_ZIP_SHA256 = 'a3bcf1afaae94193cc3a55bf07c45112dc8d3229c04ccdb78ac01dea9f33e2f3'
              }
            }
            '34' {
              # Candidate CI compiled the synthetic merge; the app inputs match PR121.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = 'ae525890e1d536ac696aca03112c5cb9143c9eb7'
                RELEASE_COMPILED_SOURCE_SHA = 'cd9ccafb72e4a277e54b891874ece3ad32e08d4c'
                RELEASE_SOURCE_TREE = '857ffcfebc13a139f9611e8e0d45ad0e09363a91'
                RELEASE_PRODUCT_VERSION = '0.2.20+34'
                RELEASE_CI_BRANCH = 'codex/release34'
              }
              $artifactPins = [ordered]@{
                CI_RUN_ID = '40099505514'
                CI_ARTIFACT_ID = '12561934120'
                CI_ARTIFACT_DIGEST = 'sha256:bd488e6d4bc46f1b550f3b95b3bc1e1e4959de5a165b6dd9074d28b26956b410'
                PORTABLE_MANIFEST_SHA256 = '892EBCAAA7984104CF9FF0C794A809075E57A7ABD4EA74C1E57963C2807EFD54'
                PORTABLE_ZIP_SHA256 = 'F699EEEFC16E5925C7101D73193F8D9A4BB6FAC1B923E07D769469DBC7A4867B'
              }
            }
            '35' {
              # Integrated candidate CI compiled the synthetic merge, with the same product tree.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = '78a60003eb28a347613a756530f34baff949ec95'
                RELEASE_COMPILED_SOURCE_SHA = '7f0a94d0adf4b98c8c3aac85df93117b54beddeb'
                RELEASE_SOURCE_TREE = '63ae2f536f240071ca25f0c46f8887f33d05d7d2'
                RELEASE_PRODUCT_VERSION = '0.2.21+35'
                RELEASE_CI_BRANCH = 'codex/latest-integration'
              }
              $artifactPins = [ordered]@{
                CI_RUN_ID = '40121527609'
                CI_ARTIFACT_ID = '12570919328'
                CI_ARTIFACT_DIGEST = 'sha256:8e0d2fcfcb0ce02f22ea2610e9ff623fc003d75fead8743f236816889bf0c76d'
                PORTABLE_MANIFEST_SHA256 = '0cead8cbf39995604aca23454bed58222e53c899109f939097e8507003a9bb87'
                PORTABLE_ZIP_SHA256 = '74ccaff7bab88905a464ea3930129ee7a3921c1a9361b3ca497e1e51c85e2ea5'
              }
            }
            '36' {
              # Qualified PR131 candidate CI compiled the synthetic merge of the same product tree.
              $pins = [ordered]@{
                RELEASE_HEAD_SHA = 'c3f41b875d87e15536ee0dd321d6ceeb8601d32f'
                RELEASE_COMPILED_SOURCE_SHA = 'f156497aef23c0cedc244c9812a1ce5a87cc4474'
                RELEASE_SOURCE_TREE = '9320e5736a9fd01332f2e245f5e9bb5d94324663'
                RELEASE_PRODUCT_VERSION = '0.2.22+36'
                RELEASE_CI_BRANCH = 'codex/release36-privacy'
              }
              $artifactPins = [ordered]@{
                CI_RUN_ID = '40127665049'
                CI_ARTIFACT_ID = '12574025355'
                CI_ARTIFACT_DIGEST = 'sha256:de367997d70392b09c74beb3cf5f26ba144c62b11843ea838d1d061cc5736bef'
                PORTABLE_MANIFEST_SHA256 = '675ad3bb0543d2404095a5920546a00ae8ade924d1177a2be3b8984783390d81'
                PORTABLE_ZIP_SHA256 = '052b2738ff9afdd26c0a5d9a8c16d3f63f072279e0955430b8eb77741570acb4'
              }
            }
            default { throw "Unknown Store release '$($env:RELEASE)'." }
          }
          if ($null -eq $artifactPins) {
            foreach ($entry in $supplied.GetEnumerator()) {
              if ([string]::IsNullOrWhiteSpace($entry.Value)) { throw "Release $($env:RELEASE) requires the $($entry.Key.ToLowerInvariant()) input." }
            }
            $artifactPins = $supplied
          } else {
            foreach ($entry in $supplied.GetEnumerator()) {
              if (-not [string]::IsNullOrWhiteSpace($entry.Value)) { throw "Release $($env:RELEASE) has frozen artifact pins; do not supply $($entry.Key.ToLowerInvariant())." }
            }
          }
          foreach ($table in @($pins, $artifactPins)) {
            foreach ($entry in $table.GetEnumerator()) {
              "$($entry.Key)=$($entry.Value)" | Out-File -FilePath $env:GITHUB_ENV -Append
            }
          }

      - name: Refuse packaging until successful CI pins are frozen
        shell: pwsh
        run: |
          if ($env:RELEASE_HEAD_SHA -notmatch '^[A-Fa-f0-9]{40}$' -or
              $env:RELEASE_COMPILED_SOURCE_SHA -notmatch '^[A-Fa-f0-9]{40}$' -or
              $env:RELEASE_SOURCE_TREE -notmatch '^[A-Fa-f0-9]{40}$') {
            throw "Release $($env:RELEASE) source pins are incomplete; wait for the successful CI manifest and freeze exact commit/tree metadata before dispatch."
          }
          if ($env:RELEASE_PRODUCT_VERSION -notmatch "^\d+\.\d+\.\d+\+$($env:RELEASE)$") {
            throw "Release $($env:RELEASE) product version pin changed unexpectedly."
          }

      - name: Validate supplied CI artifact pins
        shell: pwsh
        run: |
          if ($env:CI_RUN_ID -notmatch '^\d+$') { throw 'CI_RUN_ID must be numeric.' }
          if ($env:CI_ARTIFACT_ID -notmatch '^\d+$') { throw 'CI_ARTIFACT_ID must be numeric.' }
          if ($env:CI_ARTIFACT_DIGEST -notmatch '^sha256:[A-Fa-f0-9]{64}$') { throw 'CI_ARTIFACT_DIGEST must be sha256:<64 hex characters>.' }
          if ($env:PORTABLE_MANIFEST_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { throw 'PORTABLE_MANIFEST_SHA256 must be 64 hex characters.' }
          if ($env:PORTABLE_ZIP_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { throw 'PORTABLE_ZIP_SHA256 must be 64 hex characters.' }

      - name: Verify exact successful release CI run and artifact
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const runId = Number(process.env.CI_RUN_ID);
            const artifactId = Number(process.env.CI_ARTIFACT_ID);
            const expectedDigest = process.env.CI_ARTIFACT_DIGEST.toLowerCase();
            const expectedSha = process.env.RELEASE_HEAD_SHA.toLowerCase();
            const release = process.env.RELEASE;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId
            });
            if (run.status !== "completed" || run.conclusion !== "success" ||
                run.name !== "CI" || run.head_branch !== process.env.RELEASE_CI_BRANCH ||
                run.head_sha.toLowerCase() !== expectedSha) {
              throw new Error(`Release CI run is not successful at the pinned release ${release} commit.`);
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: runId, per_page: 100
            });
            const matches = data.artifacts.filter(a =>
              a.id === artifactId && a.name === "windows-release-bundle" && !a.expired
            );
            if (matches.length !== 1 || matches[0].digest.toLowerCase() !== expectedDigest) {
              throw new Error("Release bundle artifact ID, name, availability, or digest does not match the supplied pin.");
            }
            core.setOutput("artifact_id", String(artifactId));

      - name: Download the exact portable CI artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/singbook-release${{ env.RELEASE }}-artifact
          digest-mismatch: error

      - name: Check out the pinned release source and Store packaging tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the exact release product source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_HEAD_SHA }}
          path: release-source
          persist-credentials: false

      - name: Verify the source tree and portable payload hashes
        id: payload
        shell: pwsh
        run: |
          $tree = (git -C release-source rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -ne $env:RELEASE_SOURCE_TREE) { throw "Checked-out product source tree differs from the pinned release $($env:RELEASE) tree." }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "singbook-release$($env:RELEASE)-artifact"
          $manifests = @(Get-ChildItem -LiteralPath $artifactRoot -Filter 'manifest.json' -File -Recurse)
          if ($manifests.Count -ne 1) { throw "Expected one portable manifest, found $($manifests.Count)." }
          $manifestHash = (Get-FileHash -LiteralPath $manifests[0].FullName -Algorithm SHA256).Hash
          if ($manifestHash -ne ([string]$env:PORTABLE_MANIFEST_SHA256).ToUpperInvariant()) { throw 'Portable manifest SHA-256 differs from the supplied pin.' }
          $releaseManifest = Get-Content -LiteralPath $manifests[0].FullName -Raw | ConvertFrom-Json
          if ($releaseManifest.version -ne $env:RELEASE_PRODUCT_VERSION -or
              $releaseManifest.sourceCommit -ne $env:RELEASE_COMPILED_SOURCE_SHA -or
              $releaseManifest.sourceTree -ne $env:RELEASE_SOURCE_TREE -or
              $releaseManifest.configuration -ne 'release' -or
              $releaseManifest.distribution -ne 'portable-release') {
            throw 'Portable manifest version, source commit/tree, or release configuration does not match the pinned candidate.'
          }
          $zips = @(Get-ChildItem -LiteralPath $artifactRoot -Filter '*.zip' -File -Recurse)
          if ($zips.Count -ne 1) { throw "Expected one portable ZIP, found $($zips.Count)." }
          if ((Get-FileHash -LiteralPath $zips[0].FullName -Algorithm SHA256).Hash -ne ([string]$env:PORTABLE_ZIP_SHA256).ToUpperInvariant()) { throw 'Portable ZIP SHA-256 differs from the supplied pin.' }
          $payload = Join-Path $env:RUNNER_TEMP "singbook-release$($env:RELEASE)-payload"
          Expand-Archive -LiteralPath $zips[0].FullName -DestinationPath $payload
          # Stricter root check introduced with release 33, applied to every release.
          $rootEntries = @(Get-ChildItem -LiteralPath $payload -Force)
          if ($rootEntries.Count -ne 1 -or -not $rootEntries[0].PSIsContainer -or $rootEntries[0].Name -ne 'Singbook') { throw 'Portable ZIP must contain exactly one root entry: the Singbook directory.' }
          "portable=$($rootEntries[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "manifest=$($manifests[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Locate Windows SDK MakeAppx
        id: sdk
        shell: pwsh
        run: |
          $sdkRoot = Join-Path (Get-Item -LiteralPath 'Env:ProgramFiles(x86)').Value 'Windows Kits/10/bin'
          $candidates = @(Get-ChildItem -LiteralPath $sdkRoot -Filter 'makeappx.exe' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]makeappx\.exe$' } |
            Sort-Object FullName -Descending)
          if ($candidates.Count -eq 0) { throw 'Windows SDK x64 MakeAppx was not found.' }
          "path=$($candidates[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Package one unsigned release ${{ env.RELEASE }} MSIX
        id: package
        shell: pwsh
        env:
          PORTABLE: ${{ steps.payload.outputs.portable }}
          MANIFEST: ${{ steps.payload.outputs.manifest }}
          MAKEAPPX: ${{ steps.sdk.outputs.path }}
        run: |
          $icon = Join-Path $PWD 'assets/branding/singbook-icon.png'
          $releaseIcon = Join-Path $PWD 'release-source/assets/branding/singbook-icon.png'
          if ((Get-FileHash -LiteralPath $icon -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $releaseIcon -Algorithm SHA256).Hash) { throw 'Packaging icon differs from the pinned product source.' }
          $output = Join-Path $env:RUNNER_TEMP "singbook-release$($env:RELEASE)-output"
          ./scripts/windows-store/package-msix.ps1 -PortableBundle $env:PORTABLE -PortableManifest $env:MANIFEST -OutputDirectory $output -IconPath $icon -MakeAppxPath $env:MAKEAPPX -ExpectedSourceTree $env:RELEASE_SOURCE_TREE -ExpectedProductVersion $env:RELEASE_PRODUCT_VERSION
          $msix = @(Get-ChildItem -LiteralPath $output -Filter '*.msix' -File)
          $provenance = @(Get-ChildItem -LiteralPath $output -Filter 'package-provenance.json' -File)
          if ($msix.Count -ne 1 -or $provenance.Count -ne 1) { throw 'Expected exactly one MSIX and one provenance file.' }
          "msix=$($msix[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "provenance=$($provenance[0].FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$((Get-FileHash -LiteralPath $msix[0].FullName -Algorithm SHA256).Hash)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install and smoke test a temporary signed copy
        shell: pwsh
        env:
          MSIX: ${{ steps.package.outputs.msix }}
          PROVENANCE: ${{ steps.package.outputs.provenance }}
          MSIX_SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          ./scripts/test-windows-store-msix-install.ps1 `
            -MsixPath $env:MSIX `
            -ProvenancePath $env:PROVENANCE `
            -ExpectedSha256 $env:MSIX_SHA256 `
            -ExpectedSourceTree $env:RELEASE_SOURCE_TREE `
            -ExpectedSourceManifestSha256 $env:PORTABLE_MANIFEST_SHA256 `
            -ExpectedProductVersion $env:RELEASE_PRODUCT_VERSION `
            -EvidenceDirectory (Join-Path $PWD "artifacts/windows-store-msix-smoke/$env:GITHUB_RUN_ID")

      - name: Preserve package and hosted smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: singbook-store${{ env.RELEASE }}-msix-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/singbook-release${{ env.RELEASE }}-output/*.msix
            ${{ runner.temp }}/singbook-release${{ env.RELEASE }}-output/*.json
            ${{ runner.temp }}/singbook-release${{ env.RELEASE }}-output/Package/Assets/*.png
            artifacts/windows-store-msix-smoke/${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

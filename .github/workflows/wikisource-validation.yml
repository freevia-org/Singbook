name: Wikisource validation

"on":
  pull_request:
    paths:
      - .github/workflows/wikisource-validation.yml
      - lib/application/app_controller.dart
      - lib/domain/combine.dart
      - lib/providers/core/service.dart
      - lib/providers/extra/import_sources.dart
      - lib/ui/app_controller_adapter.dart
      - test/application/historical_text_import_test.dart
      - test/domain/historical_text_import_test.dart
      - test/domain/recording_scope_test.dart
      - test/fixtures/wikisource_legacy_saved_song.json
      - test/providers/extra/adversarial_test.dart
      - test/providers/extra/extra_providers_test.dart
      - test/providers/extra/wikisource_identity_test.dart
      - test/ui/wikisource_cached_comparison_test.dart
      # Every other file the regression matrix below runs, plus dependency pins.
      - test/providers/core/providers_test.dart
      - test/domain/combined_enrichment_test.dart
      - test/domain/combined_chord_union_test.dart
      - test/application/ready_source_save_test.dart
      - test/application/youtube_provider_toggle_test.dart
      - test/ui/followup_ux_test.dart
      - test/ui/comparison_diagnostics_mapping_test.dart
      - test/ui/app_controller_adapter_test.dart
      - pubspec.yaml
      - pubspec.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wikisource-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.8"
  CI_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Static analysis of these files is covered by the full `flutter analyze`
  # in ci.yml (same Flutter version); this workflow keeps only the
  # mock-only regression groups that run with the source catalog disabled.
  regressions:
    name: Wikisource ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: historical-import
            paths: >-
              test/providers/extra/wikisource_identity_test.dart
              test/domain/historical_text_import_test.dart
              test/application/historical_text_import_test.dart
              test/ui/wikisource_cached_comparison_test.dart
          - group: provider-domain
            paths: >-
              test/providers/extra/extra_providers_test.dart
              test/providers/extra/adversarial_test.dart
              test/providers/core/providers_test.dart
              test/domain/combined_enrichment_test.dart
              test/domain/combined_chord_union_test.dart
              test/domain/recording_scope_test.dart
          - group: cached-comparison
            paths: >-
              test/application/ready_source_save_test.dart
              test/application/youtube_provider_toggle_test.dart
              test/ui/followup_ux_test.dart
              test/ui/comparison_diagnostics_mapping_test.dart
              test/ui/app_controller_adapter_test.dart
    env:
      CI_GROUP: ${{ matrix.group }}
      CI_TEST_PATHS: ${{ matrix.paths }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record exact source head and input hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/wikisource-ci/$CI_GROUP"
          git rev-parse HEAD | tee "artifacts/wikisource-ci/$CI_GROUP/head.txt"
          test "$(git rev-parse HEAD)" = "$CI_EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}' > "artifacts/wikisource-ci/$CI_GROUP/tree.txt"
          git ls-files -z | xargs -0 sha256sum > "artifacts/wikisource-ci/$CI_GROUP/source-sha256.txt"
          sha256sum pubspec.lock > "artifacts/wikisource-ci/$CI_GROUP/lock-before.txt"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          flutter --suppress-analytics --no-version-check --version > "artifacts/wikisource-ci/$CI_GROUP/flutter-version.txt" 2>&1
          set +e
          flutter --suppress-analytics --no-version-check pub get --enforce-lockfile --no-example 2>&1 | tee "artifacts/wikisource-ci/$CI_GROUP/dependencies.log"
          ci_results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${ci_results[0]}" > "artifacts/wikisource-ci/$CI_GROUP/dependencies.exit"
          printf '%s\n' "${ci_results[1]}" > "artifacts/wikisource-ci/$CI_GROUP/dependencies-tee.exit"
          git diff --binary > "artifacts/wikisource-ci/$CI_GROUP/dependency-generation.diff"
          test "${ci_results[1]}" -eq 0
          test "${ci_results[0]}" -eq 0
          sha256sum -c "artifacts/wikisource-ci/$CI_GROUP/lock-before.txt"
          git diff --exit-code

      - name: Run the selected mock-only regression group
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          read -r -a ci_test_paths <<< "$CI_TEST_PATHS"
          set +e
          flutter --suppress-analytics --no-version-check test --no-pub \
            --dart-define=SINGBOOK_SOURCE_CATALOG_URL=about:blank \
            --concurrency=1 --reporter=expanded --timeout=90s \
            "${ci_test_paths[@]}" 2>&1 | tee "artifacts/wikisource-ci/$CI_GROUP/tests.log"
          ci_results=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${ci_results[0]}" > "artifacts/wikisource-ci/$CI_GROUP/tests.exit"
          printf '%s\n' "${ci_results[1]}" > "artifacts/wikisource-ci/$CI_GROUP/tests-tee.exit"
          test "${ci_results[1]}" -eq 0
          exit "${ci_results[0]}"

      - name: Preserve group evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wikisource-${{ matrix.group }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/wikisource-ci/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 7

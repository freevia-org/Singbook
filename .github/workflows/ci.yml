name: CI

# Source checks use the same empty defines as a fresh clone. The unsigned
# Windows release bundle embeds the repository's public Desktop OAuth client
# ID as a GitHub Actions variable. This workflow uses no secrets and never signs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md ("Develop and test").
  FLUTTER_VERSION: "3.44.8"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          if [ -n "$(git ls-files --others --exclude-standard -- lib/l10n/generated)" ]; then
            echo "Untracked generated localization files; run flutter gen-l10n and commit them."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload setlist visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setlist-visual-captures
          path: artifacts/singbook-setlist-rtl-captures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID }}
      SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check Windows OAuth configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID)) {
            throw 'The SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID Actions variable is required for the Windows release bundle.'
          }

          # A public client ID can be syntactically valid while pointing at an
          # OAuth client that cannot complete the app's installed-desktop flow.
          # Exchange a deliberately invalid code: a working registration should
          # reach Google's invalid_grant response without authenticating anyone.
          $probe = @{
            client_id = $env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID
            code = 'codex-release-preflight-invalid-code'
            code_verifier = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            grant_type = 'authorization_code'
            redirect_uri = 'http://127.0.0.1:49152'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET)) {
            $probe.client_secret = $env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET
          }
          try {
            $response = Invoke-RestMethod -Method Post -Uri 'https://oauth2.googleapis.com/token' -ContentType 'application/x-www-form-urlencoded' -Body $probe
            $oauthError = $response.error
          } catch {
            $errorBody = $_.ErrorDetails.Message
            try { $oauthError = ($errorBody | ConvertFrom-Json).error }
            catch { throw 'Google OAuth desktop-client preflight could not read the token endpoint response.' }
          }
          if ($oauthError -ne 'invalid_grant') {
            if ($errorBody -match 'client_secret') { $oauthError = 'missing_client_secret' }
            throw "Google OAuth desktop-client preflight failed ($oauthError). Check that the ID is a Desktop app client and that its optional secret is configured when required."
          }

      - name: Record dependency generation source status
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/windows-parity/dependency-generation -Force | Out-Null
          git status --porcelain | Tee-Object -FilePath artifacts/windows-parity/dependency-generation/status.txt
          git diff --binary > artifacts/windows-parity/dependency-generation/generated.diff

      - name: Build and package Windows release
        shell: pwsh
        run: ./scripts/build-windows.ps1 -AllowMissingDefines

      - name: Smoke test the portable Windows app in an isolated profile
        shell: pwsh
        run: ./scripts/test-windows-portable-startup.ps1

      - name: Check native clipboard and isolated credential storage
        shell: pwsh
        run: ./scripts/test-windows-native.ps1 -CredentialStore

      - name: Run the complete Flutter suite on Windows
        run: >-
          flutter test --no-pub --concurrency=2 --reporter=expanded

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-evidence
          path: |
            artifacts/windows-parity/
            artifacts/windows/**/build.log
            artifacts/windows/**/manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve Windows release bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundle
          path: artifacts/windows/
          if-no-files-found: error
          retention-days: 7

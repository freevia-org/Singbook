name: Singbook exact-commit hosted QA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0dd8302cee853627931349c5b936e1d66a96c3f2
          persist-credentials: false

      - name: Verify product source
        run: test "$(git rev-parse HEAD)" = "0dd8302cee853627931349c5b936e1d66a96c3f2"

      - name: Check build orchestration without SDKs
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py' -v

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          if [ -n "$(git ls-files --others --exclude-standard -- lib/l10n/generated)" ]; then
            echo "Untracked generated localization files; run flutter gen-l10n and commit them."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0dd8302cee853627931349c5b936e1d66a96c3f2
          persist-credentials: false

      - name: Verify product source
        run: test "$(git rev-parse HEAD)" = "0dd8302cee853627931349c5b936e1d66a96c3f2"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Test
        run: flutter test --no-pub --exclude-tags=performance --concurrency=2

      - name: Verify isolated performance bounds
        run: >-
          flutter test --no-pub --concurrency=1 --reporter=expanded
          --tags=performance test/domain/combined_enrichment_test.dart

      - name: Validate metadata accuracy corpus and offline cache
        run: flutter test --no-pub tool/metadata_accuracy_benchmark_test.dart tool/metadata_response_cache_test.dart tool/combine_worker_benchmark_test.dart

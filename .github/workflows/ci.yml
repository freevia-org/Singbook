name: CI

# On-demand CI. Source checks use the same empty defines as a fresh clone. The unsigned
# Windows release bundle embeds the repository's public Desktop OAuth client
# ID as a GitHub Actions variable and its optional registration field as a
# masked Actions secret. This workflow never signs.
#
# Layout (fail fast, then fan out):
#   analyze ──┬─> windows-build    (release bundle, packaging + native smoke)
#             ├─> windows-test     (complete Flutter suite on Windows, sharded)
#             └─> windows-journey  (deterministic desktop integration journey)
#   test        (complete Flutter suite on Linux; runs in parallel with analyze)
# The Microsoft Store packaging workflows consume the `windows-release-bundle`
# artifact of a successful run of this workflow, so keep its name and contents.
on:
  workflow_dispatch:

permissions:
  contents: read

# Keep manual runs on a branch grouped together without cancelling active builds.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with README.md ("Develop and test").
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    runs-on: singbook-i5-linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check build orchestration without SDKs
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py' -v

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          if [ -n "$(git ls-files --others --exclude-standard -- lib/l10n/generated)" ]; then
            echo "Untracked generated localization files; run flutter gen-l10n and commit them."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

  test:
    runs-on: singbook-i5-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Test
        run: flutter test --no-pub --exclude-tags=performance --concurrency=2

      - name: Verify isolated performance bounds
        run: >-
          flutter test --no-pub --concurrency=1 --reporter=expanded
          --tags=performance test/domain/combined_enrichment_test.dart

      - name: Validate metadata accuracy corpus and offline cache
        run: flutter test --no-pub tool/metadata_accuracy_benchmark_test.dart tool/metadata_response_cache_test.dart

      - name: Upload setlist visual captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: setlist-visual-captures
          path: artifacts/singbook-setlist-rtl-captures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload responsive layout captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-layout-captures
          path: artifacts/singbook-layout-captures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload visual test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    needs: analyze
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID }}
      SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Check Android output preflight without an SDK
        shell: pwsh
        run: ./tests/scripts/build-android-preflight.Tests.ps1

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Check Windows OAuth configuration
        id: windows-oauth-preflight
        continue-on-error: true
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID)) {
            throw 'The SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID Actions variable is required for the Windows release bundle.'
          }

          # A public client ID can be syntactically valid while pointing at an
          # OAuth client that cannot complete the app's installed-desktop flow.
          # Exchange a deliberately invalid code: a working registration should
          # reach Google's invalid_grant response without authenticating anyone.
          $probe = @{
            client_id = $env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID
            code = 'codex-release-preflight-invalid-code'
            code_verifier = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
            grant_type = 'authorization_code'
            redirect_uri = 'http://127.0.0.1:49152'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET)) {
            $probe.client_secret = $env:SINGBOOK_GOOGLE_DESKTOP_CLIENT_SECRET
          }
          try {
            $response = Invoke-RestMethod -Method Post -Uri 'https://oauth2.googleapis.com/token' -ContentType 'application/x-www-form-urlencoded' -Body $probe
            $oauthError = $response.error
          } catch {
            $errorBody = $_.ErrorDetails.Message
            try { $oauthError = ($errorBody | ConvertFrom-Json).error }
            catch { throw 'Google OAuth desktop-client preflight could not read the token endpoint response.' }
          }
          if ($oauthError -ne 'invalid_grant') {
            if ($errorBody -match 'client_secret') { $oauthError = 'missing_client_secret' }
            throw "Google OAuth desktop-client preflight failed ($oauthError). Check that the ID is a Desktop app client and that its optional secret is configured when required."
          }

      - name: Record dependency generation source status
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/windows-parity/dependency-generation -Force | Out-Null
          git status --porcelain | Tee-Object -FilePath artifacts/windows-parity/dependency-generation/status.txt
          git diff --binary > artifacts/windows-parity/dependency-generation/generated.diff

      - name: Build and package Windows release
        shell: pwsh
        run: ./scripts/build-windows.ps1 -AllowMissingDefines

      - name: Inspect Windows PDF printer capability
        shell: pwsh
        run: |
          $evidencePath = 'artifacts/windows-parity/print-acceptance-runner-capabilities.json'
          New-Item -ItemType Directory -Path (Split-Path $evidencePath) -Force | Out-Null
          $printers = @()
          $printerQueryError = $null
          try {
            $printers = @(Get-Printer | Select-Object Name, DriverName, PortName, Type, Shared)
          } catch {
            $printerQueryError = $_.Exception.GetType().FullName
          }
          $printToPdfFeature = $null
          $featureQueryError = $null
          try {
            $feature = Get-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features
            $printToPdfFeature = $feature.State.ToString()
          } catch {
            $featureQueryError = $_.Exception.GetType().FullName
          }
          $evidence = [ordered]@{
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            spooler = (Get-Service -Name Spooler).Status.ToString()
            printerQueryError = $printerQueryError
            printers = $printers
            printToPdfOptionalFeature = $printToPdfFeature
            featureQueryError = $featureQueryError
            localMicrosoftPrintToPdf = [bool]($printers | Where-Object {
              $_.Name -eq 'Microsoft Print to PDF' -and $_.DriverName -match 'Microsoft Print To PDF'
            })
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          $evidence | ConvertTo-Json -Depth 5

      - name: Smoke test the portable Windows app in an isolated profile
        shell: pwsh
        run: ./scripts/test-windows-portable-startup.ps1

      - name: Check native clipboard formats and isolated credential storage
        shell: pwsh
        run: ./scripts/test-windows-native.ps1 -Clipboard -CredentialStore

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-validation-evidence
          path: |
            artifacts/windows-parity/
            artifacts/windows/**/build.log
            artifacts/windows/**/manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve Windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-bundle
          # Store packaging consumes the archive and matching provenance only;
          # build logs remain in the separate validation evidence artifact.
          path: |
            artifacts/windows/*/*.zip
            artifacts/windows/*/manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce Windows OAuth release readiness
        if: always() && steps.windows-oauth-preflight.outcome != 'success'
        shell: pwsh
        run: |
          throw 'Windows OAuth preflight failed. The package and native checks ran, but the release is not ready for Google Drive sign-in.'

  windows-test:
    name: windows-test (${{ matrix.shard }}/2)
    needs: analyze
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Run the complete Flutter suite on Windows (shard ${{ matrix.shard }} of 2)
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        shell: bash
        run: >-
          flutter test --no-pub --exclude-tags=performance --concurrency=2 --reporter=expanded
          --total-shards=2 --shard-index=$((SHARD_INDEX - 1))

      - name: Preserve Windows test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-evidence-${{ matrix.shard }}
          path: |
            artifacts/singbook-layout-captures/
            artifacts/singbook-setlist-rtl-captures/
            test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  windows-journey:
    needs: analyze
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Run the deterministic Windows desktop journey
        run: >-
          flutter test integration_test/singbook_journey_device_test.dart
          -d windows --dart-define=SINGBOOK_SKIP_SCREENSHOTS=true
          --reporter=expanded

      - name: Verify repeated native Windows fullscreen transitions
        run: >-
          flutter test integration_test/player_fullscreen_device_test.dart
          -d windows --dart-define=SINGBOOK_SKIP_SCREENSHOTS=true
          --reporter=expanded

name: Singbook exact-commit hosted QA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fdc212fada48ff5e6c290e732444433e2a01f699
          persist-credentials: false

      - name: Verify product source
        run: test "$(git rev-parse HEAD)" = "fdc212fada48ff5e6c290e732444433e2a01f699"

      - name: Check build orchestration without SDKs
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py' -v

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          if [ -n "$(git ls-files --others --exclude-standard -- lib/l10n/generated)" ]; then
            echo "Untracked generated localization files; run flutter gen-l10n and commit them."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fdc212fada48ff5e6c290e732444433e2a01f699
          persist-credentials: false

      - name: Verify product source
        run: test "$(git rev-parse HEAD)" = "fdc212fada48ff5e6c290e732444433e2a01f699"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Recording context and Save regression tests
        run: >-
          flutter test --no-pub --reporter=expanded
          test/providers/core/recording_context_test.dart
          test/providers/core/recording_context_discovery_test.dart
          test/application/acousticbrainz_flow_test.dart
          test/application/source_checks_analysis_test.dart
          test/application/provider_merge_pipeline_test.dart
          test/application/ready_source_save_test.dart

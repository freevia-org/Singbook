name: CI

# Source checks and an unsigned offline Windows preview. This workflow uses no
# secrets and never signs anything. config/local.defines.json is absent, so
# tests run with the same empty defines as a fresh clone.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with README.md ("Develop and test").
  FLUTTER_VERSION: "3.44.8"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generated localizations are up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated
          if [ -n "$(git ls-files --others --exclude-standard -- lib/l10n/generated)" ]; then
            echo "Untracked generated localization files; run flutter gen-l10n and commit them."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Upload visual test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-failures
          path: test/**/failures/**
          if-no-files-found: ignore
          retention-days: 7

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --debug

      - name: Check native clipboard and isolated credential storage
        shell: pwsh
        run: ./scripts/test-windows-native.ps1 -CredentialStore

      - name: Windows platform regression checks
        run: >-
          flutter test --no-pub --concurrency=2
          test/data/windows_database_test.dart
          test/application/windows_export_test.dart
          test/sync/windows_google_auth_test.dart
          test/providers/windows_transport_test.dart
          test/providers/windows_http_client_test.dart
          test/ui/windows_exit_test.dart
          test/ui/windows_input_test.dart

      - name: Preserve Windows validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-evidence
          path: artifacts/windows-parity/
          if-no-files-found: ignore
          retention-days: 7

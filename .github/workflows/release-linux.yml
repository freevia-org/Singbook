name: Build and publish Singbook Linux prerelease

# Two jobs with separate privileges. `build` compiles, packages and smoke-tests
# with a read-only token: no build-time dependency can publish or sign. `publish`
# only receives the finished packages, re-checks them against the manifest,
# signs them keylessly and publishes; it never checks out or runs project code.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: singbook-linux-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      packages_artifact_id: ${{ steps.packages.outputs['artifact-id'] }}
    env:
      SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID }}
    steps:
      - name: Check out the current main source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate public Google Desktop OAuth client ID
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "A valid public Google Desktop OAuth client ID is required for this release." >&2
            exit 1
          fi

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-14-dev imagemagick xvfb libegl1 libgl1-mesa-dri \
            libsecret-1-dev zenity desktop-file-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build Linux release
        run: scripts/build-linux.sh release

      - name: Package AppImage and Debian package
        run: scripts/package-linux.sh build/linux-packages

      - name: Verify and smoke-launch the packaged outputs
        run: scripts/smoke-linux-packages.sh build/linux-packages

      - name: Add release manifest with source and package hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = Path("pubspec.yaml").read_text(encoding="utf-8").splitlines()
          version = next(line.split(":", 1)[1].strip().strip("'\"") for line in version if line.startswith("version:"))
          if not __import__("re").fullmatch(r"\d+\.\d+\.\d+\+\d+", version):
              raise SystemExit(f"Unexpected Singbook version format: {version}")
          root = Path("build/linux-packages")
          assets = []
          for path in sorted([*root.glob("*.deb"), *root.glob("*.AppImage")]):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty package: {path}")
              assets.append({
                  "name": path.name,
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          if len(assets) != 2:
              raise SystemExit(f"Expected one .deb and one AppImage, found {len(assets)} package(s)")
          manifest = {
              "app": "Singbook",
              "version": version,
              "sourceCommit": os.environ["GITHUB_SHA"],
              "workflowRun": os.environ["GITHUB_RUN_ID"],
              "packages": assets,
          }
          (root / "LINUX-RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Hand the packages and manifest to the publish job
        id: packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-release-packages-${{ github.run_id }}
          path: |
            build/linux-packages/*.deb
            build/linux-packages/*.AppImage
            build/linux-packages/LINUX-RELEASE-MANIFEST.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the exact same-run packages
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.packages_artifact_id }}
          path: ${{ runner.temp }}/linux-packages
          digest-mismatch: error

      - name: Check the transferred packages against the manifest
        id: release
        shell: bash
        env:
          PACKAGES: ${{ runner.temp }}/linux-packages
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PACKAGES"])
          manifests = sorted(root.rglob("LINUX-RELEASE-MANIFEST.json"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected one release manifest, found {len(manifests)}")
          directory = manifests[0].parent
          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          if manifest.get("sourceCommit") != os.environ["GITHUB_SHA"] or \
                  manifest.get("workflowRun") != os.environ["GITHUB_RUN_ID"]:
              raise SystemExit("Release manifest was not produced by this run and commit")
          match = re.fullmatch(r"(\d+\.\d+\.\d+)\+(\d+)", str(manifest.get("version", "")))
          if not match:
              raise SystemExit("Unexpected Singbook version format in the manifest")
          packages = manifest.get("packages") or []
          names = sorted(str(item["name"]) for item in packages)
          present = sorted(p.name for p in directory.iterdir()
                           if p.is_file() and p.name != manifests[0].name)
          if len(names) != 2 or names != present:
              raise SystemExit("Transferred files do not match the manifest package list")
          for item in packages:
              name = str(item["name"])
              if not re.fullmatch(r"[A-Za-z0-9._+-]+\.(deb|AppImage)", name):
                  raise SystemExit("Unexpected package file name in the manifest")
              data = (directory / name).read_bytes()
              if len(data) != item["size"] or hashlib.sha256(data).hexdigest() != item["sha256"]:
                  raise SystemExit(f"Package differs from the manifest: {name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"directory={directory}\n")
              output.write(f"version={match.group(1)}\n")
              output.write(f"build={match.group(2)}\n")
          PY

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Linux packages and manifest
        shell: bash
        env:
          PACKAGES: ${{ steps.release.outputs.directory }}
        run: |
          set -euo pipefail
          cd "$PACKAGES"
          for asset in *.deb *.AppImage LINUX-RELEASE-MANIFEST.json; do
            test -s "$asset"
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done

      - name: Publish versioned Linux prerelease to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.release.outputs.directory }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BUILD: ${{ steps.release.outputs.build }}
        run: |
          set -euo pipefail
          cd "$PACKAGES"
          release="$RELEASE_VERSION"
          build="$RELEASE_BUILD"
          tag="linux-v${release}-build${build}"
          # A published release is never replaced. A draft can only be the
          # incomplete result of an earlier failed run: discard it and retry.
          if existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$existing" != "true" ]]; then
              echo "Release tag already exists; refusing to replace it: $tag" >&2
              exit 1
            fi
            echo "Discarding an incomplete draft left by an earlier run: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          release_assets=(*.deb *.AppImage LINUX-RELEASE-MANIFEST.json)
          for asset in "${release_assets[@]}"; do
            test -s "$asset.sha256"
            test -s "$asset.sigstore.json"
            release_assets+=("$asset.sha256" "$asset.sigstore.json")
          done
          # Upload everything to a draft first, so a failed upload never leaves
          # a public release with missing packages or signatures.
          gh release create "$tag" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Singbook ${release}+${build} — Linux" \
            --notes "Linux x86_64 preview built from ${GITHUB_SHA}. Package contents and a smoke launch of the packaged .deb and AppImage passed on Ubuntu 24.04. The manifest records package hashes; SHA-256 files and keyless Sigstore bundles for both packages and the manifest are included." \
            --draft --prerelease
          uploaded="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          expected="$(printf '%s\n' "${release_assets[@]}" | LC_ALL=C sort)"
          if [[ "$uploaded" != "$expected" ]]; then
            echo "Draft release assets differ from the signed package set; leaving the draft unpublished." >&2
            exit 1
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

name: Build and publish Singbook Linux prerelease

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: singbook-linux-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID }}
    steps:
      - name: Check out the current main source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate public Google Desktop OAuth client ID
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SINGBOOK_GOOGLE_DESKTOP_CLIENT_ID" =~ ^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "A valid public Google Desktop OAuth client ID is required for this release." >&2
            exit 1
          fi

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-14-dev imagemagick xvfb libegl1 libgl1-mesa-dri \
            libsecret-1-dev zenity desktop-file-utils

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Build Linux release
        run: scripts/build-linux.sh release

      - name: Package AppImage and Debian package
        run: scripts/package-linux.sh build/linux-packages

      - name: Verify packaged outputs and smoke-launch the app
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(build/linux-packages/*.deb)
          appimages=(build/linux-packages/*.AppImage)
          [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]]
          dpkg-deb --contents "${debs[0]}" | grep -E 'opt/singbook/singbook|opt/singbook/lib/libapp.so'
          timeout 20 xvfb-run -a build/linux/x64/release/bundle/singbook || [[ $? -eq 124 ]]

      - name: Add release manifest with source and package hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = Path("pubspec.yaml").read_text(encoding="utf-8").splitlines()
          version = next(line.split(":", 1)[1].strip().strip("'\"") for line in version if line.startswith("version:"))
          if not __import__("re").fullmatch(r"\d+\.\d+\.\d+\+\d+", version):
              raise SystemExit(f"Unexpected Singbook version format: {version}")
          root = Path("build/linux-packages")
          assets = []
          for path in sorted([*root.glob("*.deb"), *root.glob("*.AppImage")]):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty package: {path}")
              assets.append({
                  "name": path.name,
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          if len(assets) != 2:
              raise SystemExit(f"Expected one .deb and one AppImage, found {len(assets)} package(s)")
          manifest = {
              "app": "Singbook",
              "version": version,
              "sourceCommit": os.environ["GITHUB_SHA"],
              "workflowRun": os.environ["GITHUB_RUN_ID"],
              "packages": assets,
          }
          (root / "LINUX-RELEASE-MANIFEST.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Publish versioned Linux prerelease to GitHub
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "'\"")"
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "Unexpected Singbook version format: $version" >&2
            exit 1
          fi
          release="${BASH_REMATCH[1]}"
          build="${BASH_REMATCH[2]}"
          tag="linux-v${release}-build${build}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace it: $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            build/linux-packages/*.deb \
            build/linux-packages/*.AppImage \
            build/linux-packages/LINUX-RELEASE-MANIFEST.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Singbook ${release}+${build} — Linux" \
            --notes "Linux x86_64 preview built from ${GITHUB_SHA}. The manifest records exact package hashes. SHA-256 files and keyless Sigstore bundles are added by the signing workflow after publication." \
            --prerelease
          gh workflow run sign-linux-release-assets.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "release_tag=$tag"

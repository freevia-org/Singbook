name: macOS compilation

# On-demand compile-only lane: macOS regression tests plus an unsigned universal build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with ci.yml and README.md ("Develop and test").
  FLUTTER_VERSION: "3.44.8"

jobs:
  compile:
    runs-on: singbook-macmini
    timeout-minutes: 25
    defaults:
      run:
        # Quote the runner-generated script path; this host's _work directory
        # contains spaces ("/Volumes/MacMini Work/...").
        shell: bash --noprofile --norc -e -o pipefail "{0}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Report public Apple signing metadata
        run: |
          set +x
          identity_list="$(mktemp)"
          trap 'rm -f "$identity_list"' EXIT
          security find-identity -v -p codesigning > "$identity_list" 2>/dev/null || true
          while IFS='|' read -r fingerprint common_name; do
            [[ -n "$fingerprint" && -n "$common_name" ]] || continue
            cert_pem="$(mktemp)"
            trap 'rm -f "$identity_list" "$cert_pem"' EXIT
            if security find-certificate -c "$common_name" -p > "$cert_pem" 2>/dev/null; then
              subject="$(openssl x509 -in "$cert_pem" -noout -subject -nameopt RFC2253 2>/dev/null | sed 's/^subject=//')"
              sha256="$(openssl x509 -in "$cert_pem" -noout -fingerprint -sha256 2>/dev/null | sed 's/^[^=]*=//')"
              team_id="$(printf '%s\n' "$subject" | sed -nE 's/.*(^|,)OU=([^,\/]+).*/\2/p')"
              echo "codesign_identity_name=$common_name"
              echo "codesign_certificate_fingerprint_sha1=$fingerprint"
              echo "codesign_certificate_fingerprint_sha256=$sha256"
              echo "codesign_certificate_subject=$subject"
              echo "codesign_certificate_team_id=${team_id:-unavailable}"
            fi
            rm -f "$cert_pem"
          done < <(sed -nE 's/^[[:space:]]*[0-9]+\) ([[:xdigit:]]+) "([^"]+)".*/\1|\2/p' "$identity_list")

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          matching_profiles=0
          if [[ -d "$profile_dir" ]]; then
            for profile in "$profile_dir"/*.provisionprofile; do
              [[ -f "$profile" ]] || continue
              profile_plist="$(mktemp)"
              if security cms -D -i "$profile" -o "$profile_plist" >/dev/null 2>&1; then
                app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist" 2>/dev/null || true)"
                if [[ "$app_id" == *.org.freevia.singbook ]]; then
                  matching_profiles=$((matching_profiles + 1))
                  profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist" 2>/dev/null || true)"
                  profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist" 2>/dev/null || true)"
                  profile_expiry="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$profile_plist" 2>/dev/null || true)"
                  echo "macos_app_store_profile_name=$profile_name"
                  echo "macos_app_store_profile_app_id=$app_id"
                  echo "macos_app_store_profile_team_id=$profile_team"
                  echo "macos_app_store_profile_expiry=$profile_expiry"
                fi
              fi
              rm -f "$profile_plist"
            done
          fi
          echo "matching_macos_app_store_profile_count=$matching_profiles"
          echo 'required_bundle_id=org.freevia.singbook'
          echo 'required_icloud_container=iCloud.org.freevia.singbook'
      - name: Install pinned Flutter with the upstream setup script
        run: |
          set +x
          setup_script="$RUNNER_TEMP/subosito-flutter-setup.sh"
          curl --fail --silent --show-error --location \
            'https://raw.githubusercontent.com/subosito/flutter-action/1a449444c387b1966244ae4d4f8c696479add0b2/setup.sh' \
            --output "$setup_script"
          echo '35f0cd9e9c1d7a643448223573b4a03879e63676fdc27872de3d0104d5bf89f9  '"$setup_script" | shasum --check --status
          bash "$setup_script" -n "$FLUTTER_VERSION" -a "$RUNNER_ARCH" stable
          rm -f "$setup_script"
          flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter gen-l10n
      - name: macOS regression checks
        run: flutter test --no-pub test/sync/platform_drive_auth_test.dart test/sync/macos_platform_drive_auth_test.dart test/ui/macos_account_sync_test.dart test/ui/macos_exit_test.dart test/application/macos_desktop_parity_test.dart test/ui/macos_setlist_drag_test.dart test/application/macos_startup_options_test.dart test/application/windows_startup_options_test.dart
      - name: Configure macOS
        run: |
          version="$(awk -F': *' '/^version:/ {print $2}' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          flutter build macos --release --build-number="${version##*+}" --config-only --no-pub
      - name: Compile unsigned universal app
        run: >-
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/macos CODE_SIGNING_ALLOWED=NO build
      - name: Verify universal executable
        run: |
          executable='build/macos/Build/Products/Release/Singbook.app/Contents/MacOS/Singbook'
          architectures="$(lipo -archs "$executable")"
          for architecture in arm64 x86_64; do
            case " $architectures " in
              *" $architecture "*) ;;
              *)
                echo "::error::Expected $architecture in universal executable; found: $architectures"
                exit 1
                ;;
            esac
          done
      - name: Preserve compile output
        uses: actions/upload-artifact@v7
        with:
          name: macos-unsigned-compile-only
          path: build/macos/Build/Products/Release/Singbook.app
          retention-days: 7
          if-no-files-found: error

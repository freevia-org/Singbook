name: singbook
description: "Singbook: lyrics, chords and songbooks, together offline."
homepage: https://freevia.org/singbook/
repository: https://github.com/freevia-org/Singbook
issue_tracker: https://github.com/freevia-org/Singbook/issues
publish_to: 'none'
version: 0.2.23+37

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.5.2
  characters: ^1.4.1
  cronet_http: ^1.10.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  cupertino_http: ^3.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2
  sqflite_common_ffi: ^2.4.4
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.2
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - config/source-catalog.json
    - assets/fonts/
    - assets/fonts/brand-candidates/Lora-OFL.txt
    - assets/branding/singbook-icon.png
    - assets/branding/singbook-mark-foreground.png
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
    - family: SingbookBrand
      fonts:
        - asset: assets/fonts/SingbookBrand-Bold.ttf
          weight: 700
    - family: SingbookSerif
      fonts:
        - asset: assets/fonts/SingbookSerif-Bold.ttf
          weight: 700
